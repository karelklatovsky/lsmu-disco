<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05030a" />
    <title>LŠMU Disco</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="Hudební vizualizace"></canvas>

    <header class="topbar">
      <div class="brand" aria-label="LŠMU Disco">
        <span class="brand-mark">LŠMU</span>
        <span class="brand-copy">Galavečer<br /><strong>Disco</strong></span>
      </div>
      <div class="status" id="status">
        <i></i>
        <span>Připraveno</span>
      </div>
    </header>

    <main class="welcome" id="welcome">
      <p class="eyebrow">Živá projekce</p>
      <h1>Rozsviťte<br /><em>galavečer.</em></h1>
      <button class="start-button" id="startButton">
        <span>Spustit mikrofon</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v7a3 3 0 0 0 3 3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3M8 22h8"/></svg>
      </button>
      <button class="demo-button" id="demoButton">Vyzkoušet bez mikrofonu</button>
    </main>

    <aside class="guest-panel" id="guestPanel">
      <div class="guest-panel-copy">
        <span>Vzkazy na plátno</span>
        <strong>Naskenuj a napiš nám</strong>
        <small id="guestUrl"></small>
      </div>
      <img id="guestQr" alt="QR kód pro odeslání vzkazu" />
    </aside>

    <section class="message-stage" id="messageStage" aria-live="polite">
      <p id="messageText"></p>
      <span id="messageAuthor"></span>
    </section>

    <nav class="controls" id="controls" aria-label="Ovládání projekce">
      <button class="icon-button" id="previousButton" title="Předchozí efekt" aria-label="Předchozí efekt">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <div class="scene-readout">
        <span>Efekt</span>
        <strong id="sceneName">Paprsky</strong>
      </div>
      <button class="icon-button" id="nextButton" title="Další efekt" aria-label="Další efekt">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
      </button>
      <span class="divider"></span>
      <button class="icon-button laser-button" id="laserButton" title="Zobrazit LŠMU" aria-label="Zobrazit LŠMU">LŠ</button>
      <button class="icon-button" id="guestButton" title="Zobrazit QR kód" aria-label="Zobrazit QR kód" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3" /></svg>
      </button>
      <button class="icon-button" id="autoButton" title="Automatické střídání" aria-label="Automatické střídání" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M20 7h-5V2M4 17h5v5M19 12a7 7 0 0 0-12-5L4 10M5 12a7 7 0 0 0 12 5l3-3" /></svg>
      </button>
      <button class="icon-button" id="fullscreenButton" title="Celá obrazovka" aria-label="Celá obrazovka">
        <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" /></svg>
      </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js"></script>
    <script src="config.js?v=2"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
