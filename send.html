<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d7ff3f" />
    <title>Pošli vzkaz | LŠMU</title>
    <link rel="stylesheet" href="send.css" />
  </head>
  <body>
    <header>
      <span class="logo">LŠMU</span>
      <span>Galavečer</span>
    </header>
    <main>
      <p class="eyebrow">Živě na plátno</p>
      <h1>Pošli svůj<br /><em>vzkaz.</em></h1>
      <form id="messageForm">
        <label for="message">Vzkaz</label>
        <textarea id="message" name="message" maxlength="120" rows="4" placeholder="Co chceš vzkázat sálu?" required></textarea>
        <div class="counter"><span id="count">0</span>/120</div>
        <label for="name">Podpis <small>nepovinný</small></label>
        <input id="name" name="name" maxlength="24" placeholder="Tvoje jméno" />
        <button type="submit" id="submitButton">
          <span>Poslat na plátno</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 8-16 8 3-8-3-8Z"/><path d="M7 12h13"/></svg>
        </button>
      </form>
      <div class="result" id="result" role="status"></div>
    </main>
    <footer>Vzkazy se zobrazují veřejně. Buďte prosím ohleduplní.</footer>
    <script src="config.js"></script>
    <script src="send.js"></script>
  </body>
</html>
